<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Shop — Catalog</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="catalog">
  <header class="site-header">
    <div class="container head-row">
      <a class="brand" href="/">Demo Shop</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/products">Catalog</a>
        <a href="/product/1">Featured</a>
        <a href="/cart">Cart <span class="nav-badge" id="nav-cart-count" hidden></span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Catalog</h1>
    <p class="page-sub">Every item below comes from <code>GET /api/products</code> on every page view — nothing is cached in the HTML.</p>

    <div id="catalog-tools" class="catalog-tools">
      <label class="catalog-tools-label" for="catalog-sort">Sort by</label>
      <select id="catalog-sort">
        <option value="default">Server order</option>
        <option value="name">Name</option>
        <option value="price-asc">Price, low to high</option>
        <option value="price-desc">Price, high to low</option>
      </select>
      <span id="catalog-count" class="catalog-count"></span>
    </div>

    <div id="catalog" class="grid" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      Demo data only. Catalog resets on server restart.
    </div>
  </footer>
</body>
</html>
